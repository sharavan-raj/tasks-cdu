<!DOCTYPE html>
<html lang="en">
<head>

  <title>My Webpage Tasks Showcase</title>
  <style>
    body { font-family: sans-serif; padding: 2rem; text-align: center; }
    .grid { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; margin-top: 2rem; }
    .card {
      padding: 1.5rem 2.5rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      text-decoration: none;
      color: #333;
      font-weight: bold;
    }
    .card:hover { background-color: #f0f0f0; }
  </style>
</head>
<body>
  <h1>My Web Development Tasks</h1>
  <p>Select a task to view the webpage:</p>

  <div class="grid">
    <a href="task1.html" class="card">Task 1</a>
    <a href="task2.html" class="card">Task 2</a>
    <a href="task3.html" class="card">Task 3</a>
    <a href="task4.html" class="card">Task 4</a>
    <a href="task5.html" class="card">Task 5</a>
  </div>
</body>
</html>
